aid: shakr-media
name: Shakr Media
description: >-
  Shakr is a video creation platform that helps businesses produce and automate
  video at scale. The Shakr Video API (v2) offers programmatic end-to-end video
  production: create a versioned creative template (TemplateStyleVersion), map
  input content (text, images, video, audio, fonts) onto its editable spec, kick
  off a render session, and automatically deliver the finished video to
  destinations such as Amazon S3, Microsoft Azure Blob Storage, and Facebook Ad
  Accounts — with completion webhooks. The Shakr Video Editor SDK embeds a
  white-labeled drag-and-drop video editor directly inside a customer's product.
  Authentication uses the OAuth 2.0 Client Credentials Grant with scoped bearer
  tokens. Shakr is a 500 Global portfolio company.
